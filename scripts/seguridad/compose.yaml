# Escáneres del workflow «Seguridad», fijados por versión y digest: aunque alguien reescriba una etiqueta
# (en marzo de 2026 se publicaron imágenes de Trivy comprometidas bajo etiquetas existentes, `latest`
# incluida), acá se ejecuta siempre la misma imagen. No levanta servicios: el workflow usa `docker compose run`.
# Dependabot (ecosistema docker-compose) propone las versiones nuevas. Solo puede esperar 7 días con las de
# Docker Hub (GHCR no informa la fecha de publicación): las de GHCR se fusionan con 7 días de publicadas y CI
# en verde. Las reglas de Semgrep y la base de vulnerabilidades de Trivy se descargan en cada corrida.
name: escaneres

services:
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  semgrep:
    image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
  trivy:
    image: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    # La app de prueba escucha en localhost del runner.
    network_mode: host
