name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC: reglas y bases de vulnerabilidades nuevas
  workflow_dispatch:

permissions:
  contents: read

# Los escáneres son imágenes oficiales fijadas por versión y digest en .github/escaneres/compose.yaml
# (Dependabot propone las nuevas). Las reglas de Semgrep y la base de Trivy se descargan en cada corrida.
# No despliegan nada ni reciben secretos, y el checkout no deja el token en el repositorio que leen.
jobs:
  secretos:
    name: Secretos en todo el historial (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker compose -f .github/escaneres/compose.yaml run --rm -T -v "$PWD:/repo" gitleaks git /repo --redact --verbose

  sast:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: >-
          docker compose -f .github/escaneres/compose.yaml run --rm -T -v "$PWD:/src" -w /src semgrep semgrep scan
          --config p/javascript --config p/typescript --config p/react --config p/owasp-top-ten --config p/secrets
          --metrics=off --severity ERROR --error

  dependencias:
    name: Dependencias y configuración (npm audit + Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Producción: ninguna vulnerabilidad alta o crítica. Desarrollo: los riesgos aceptados están en docs/security.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: >-
          docker compose -f .github/escaneres/compose.yaml run --rm -T -v "$PWD:/src" trivy fs /src
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  dast:
    name: DAST pasivo (OWASP ZAP baseline) sobre el build de producción
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-superuser-only@127.0.0.1:5432/postgres
      TEST_DB_OWNER_PASSWORD: ci-owner-only
      TEST_DB_APP_PASSWORD: ci-app-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Mismo servidor que las pruebas E2E: base efímera propia, claves aleatorias, CSP de producción.
      - run: |
          npx tsx scripts/e2e/server.ts > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3100/api/health/ready && exit 0; sleep 2; done
          cat servidor.log; exit 1
      - run: |
          mkdir -p zap && chmod 777 zap
          docker compose -f .github/escaneres/compose.yaml run --rm -T -v "$PWD/zap:/zap/wrk:rw" zap \
            zap-baseline.py -t http://localhost:3100/ingresar -r informe-zap.html -J informe-zap.json -I
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: informe-zap
          path: zap/
          retention-days: 30
