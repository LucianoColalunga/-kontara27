version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # Espera antes de proponer una versión recién publicada (los paquetes maliciosos suelen detectarse en días).
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      # Correcciones de seguridad y parches menores juntos; los cambios mayores, de a uno.
      menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen a la versión de Node con la que corre la app (22/24), no a la última.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint solo admite TypeScript < 6.1: se actualiza a mano cuando lo soporte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # Espera antes de proponer una versión recién publicada (los paquetes maliciosos suelen detectarse en días).
      default-days: 7
      semver-major-days: 14
